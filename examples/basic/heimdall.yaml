gateway:
  listen: "127.0.0.1:9090"
  policy_file: "examples/basic/policy.yaml"

identity:
  provider: static_api_keys
  clients:
    claude-code:
      user: alice
      groups:
        - engineering
      key: "my-secret-key-alice"
    cursor:
      user: bob
      groups:
        - support
      key: "my-secret-key-bob"

servers:
  everything:
    transport:
      type: http
      url: "http://localhost:3001/mcp"
      timeout: "30s"
