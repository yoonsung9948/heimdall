rules:
  - id: engineering-allow-all-tools
    effect: allow
    subjects:
      users:
        - alice
    actions:
      - "tools/list"
      - "tools/call"
    resources:
      kinds:
        - tool
      names:
        - "everything.*"

  - id: support-allow-list-files-only
    effect: allow
    subjects:
      users:
        - bob
    actions:
      - "tools/list"
      - "tools/call"
    resources:
      kinds:
        - tool
      names:
        - "everything.list_files"
